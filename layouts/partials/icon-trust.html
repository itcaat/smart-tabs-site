{{- $name := . | strings.ToLower -}}
{{- if eq $name "lock" -}}
<svg class="trust-card__icon-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 14V12a8 8 0 0116 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="6" y="14" width="20" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="21" r="2" fill="currentColor"/></svg>
{{- else if eq $name "browsers" -}}
<svg class="trust-card__icon-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="4" y="6" width="22" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 11h22" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8.5" r="1" fill="currentColor"/><circle cx="11.5" cy="8.5" r="1" fill="currentColor"/><path d="M10 16h6M10 19h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
{{- else if eq $name "shield" -}}
<svg class="trust-card__icon-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16 4l10 4v8c0 5.5-4.3 10.2-10 12-5.7-1.8-10-6.5-10-12V8l10-4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 11v10M12 15h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
{{- else -}}
<svg class="trust-card__icon-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="1.5"/></svg>
{{- end -}}
