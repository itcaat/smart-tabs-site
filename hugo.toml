baseURL = 'https://itcaat.github.io/smart-tabs-site/'
languageCode = 'en'
title = 'Smart Tabs'
defaultContentLanguage = 'en'
disableKinds = ['taxonomy', 'term']

[params]
  description = 'Browser extension — smart tab management'
  store_url = 'https://chromewebstore.google.com/detail/smart-tabs/inogfehnhcebnnojoifmabiccedlllpl'
  privacy_url = '#'
  contact_email = ''

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
lineNumbersInTable = false
noClasses = false
style = 'github-dark'
